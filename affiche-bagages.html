<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bagages pour l’avion · Sölden 2027</title>
<meta name="theme-color" content="#13509f">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#16263a;--blue:#13509f;--blue-d:#0c3a78;--muted:#5b6878;--line:#d6dee9;--soft:#e7eef8;--red:#b3261e;--red-bg:#fdecea}
*{box-sizing:border-box}
html,body{margin:0;background:#e9eef5}
body{color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px 12px}
.sheet{background:#fff;max-width:816px;margin:0 auto;padding:40px 44px 32px;border-radius:6px;box-shadow:0 4px 24px #0b3a7822}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:4px solid var(--blue);padding-bottom:14px}
.top .over{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 6px}
h1{margin:0;font-size:38px;line-height:1.05;letter-spacing:-1px}
.top .trip{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap}
.top .trip b{display:block;font-size:20px;color:var(--ink)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:26px}
.col h2{margin:0 0 12px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:var(--blue);display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px}
.col.cab h2{background:var(--blue-d)}
.item{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item svg{width:96px;height:96px}
.item b{display:block;font-size:22px;line-height:1.15}
.item small{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.note{margin:6px 0 0;font-size:15px;background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--blue-d);font-weight:600}
.warn{margin-top:26px;display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;background:var(--red-bg);border:3px solid var(--red);border-radius:16px;padding:18px 22px}
.warn svg{width:110px;height:110px}
.warn .k{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:800;margin:0 0 4px}
.warn p{margin:0;font-size:24px;line-height:1.2;font-weight:700;color:#5c1813}
.tips{margin:20px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tips li{font-size:14px;color:var(--ink);border-left:4px solid var(--blue);padding:4px 0 4px 10px}
.foot{margin-top:22px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.bar{max-width:816px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end}
.bar a,.bar button{font:inherit;font-size:14px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
.bar a{background:#fff;color:var(--blue)}
@media(max-width:640px){.sheet{padding:24px 18px}h1{font-size:28px}.cols{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.top .trip{text-align:left}.warn{grid-template-columns:70px 1fr}.warn svg{width:70px;height:70px}.warn p{font-size:19px}.tips{grid-template-columns:1fr}.item{grid-template-columns:72px 1fr}.item svg{width:72px;height:72px}}
@media print{@page{size:letter;margin:10mm}html,body{background:#fff;padding:0}.sheet{box-shadow:none;max-width:none;padding:6mm 4mm;border-radius:0}.bar{display:none}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar"><a href="./#infos">Retour à l’app</a><button type="button" onclick="print()">Imprimer ou PDF</button></div>
<main class="sheet">
  <div class="top">
    <div><p class="over">Voyage de ski en groupe</p><h1>Qu’est-ce qu’on apporte<br>dans l’avion?</h1></div>
    <div class="trip"><b id="t-titre">Sölden 2027</b><span id="t-dates">5 au 13 mars 2027</span></div>
  </div>

  <div class="cols">
    <section class="col">
      <h2>En soute</h2>
      <div id="soute"></div>
      <p class="note" id="noteSoute"></p>
    </section>
    <section class="col cab">
      <h2>En cabine</h2>
      <div id="cabine"></div>
    </section>
  </div>

  <div class="warn">
    <svg viewBox="0 0 110 110" aria-hidden="true">
      <rect x="22" y="30" width="58" height="62" rx="10" fill="#fff" stroke="#b3261e" stroke-width="5"/>
      <rect x="40" y="20" width="22" height="12" rx="3" fill="#b3261e"/>
      <path d="M55 42 L44 64 H54 L48 82 L66 56 H55 L60 42 Z" fill="#b3261e"/>
      <circle cx="82" cy="80" r="20" fill="#13509f" stroke="#fff" stroke-width="4"/>
      <path d="M72 81 L80 88 L93 73" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><p class="k">Très important</p><p id="important">Les batteries externes et les batteries au lithium voyagent avec vous en cabine, jamais en soute.</p></div>
  </div>

  <ul class="tips" id="tips"></ul>

  <div class="foot"><span>Voyage organisé par Gendron Ski</span><span id="f-url"></span></div>
</main>

<script id="defaut" type="application/json">{"titre": "Sölden 2027", "bagages": {"soute": [{"t": "Sac à skis", "d": "Skis et bâtons"}, {"t": "Sac à bottes", "d": "Bottes de ski"}, {"t": "1 bagage de 23 kg", "d": "Vêtements et effets personnels"}], "noteSoute": "Le sac à skis et le sac à bottes sont en plus du bagage de 23 kg.", "cabine": [{"t": "1 bagage à main", "d": "Format cabine, dans le compartiment au-dessus du siège"}, {"t": "1 sac personnel", "d": "Sac à dos ou sac à main, sous le siège devant vous"}], "important": "Très important : les batteries externes et les batteries au lithium voyagent avec vous en cabine, jamais en soute.", "conseils": ["Gardez dans votre bagage à main : passeport, médicaments, chargeur et une tenue de rechange.", "Mettez une étiquette à votre nom sur chaque sac."]}}</script>
<script>
(function(){
  var ICONS={
    ski:'<svg viewBox="0 0 96 96"><rect x="34" y="6" width="28" height="84" rx="12" fill="#e7eef8" stroke="#13509f" stroke-width="4"/><path d="M42 14v66M54 14v66" stroke="#13509f" stroke-width="4" stroke-linecap="round"/><path d="M40 30h16M40 62h16" stroke="#0c3a78" stroke-width="3"/><rect x="44" y="40" width="8" height="14" rx="3" fill="#13509f"/></svg>',
    bottes:'<svg viewBox="0 0 96 96"><path d="M18 34h60l6 44a6 6 0 0 1-6 7H18a6 6 0 0 1-6-7z" fill="#e7eef8" stroke="#13509f" stroke-width="4" stroke-linejoin="round"/><path d="M34 34c0-12 6-18 14-18s14 6 14 18" fill="none" stroke="#13509f" stroke-width="4"/><path d="M34 46h14v14l12 4v10H34z" fill="#13509f"/></svg>',
    valise:'<svg viewBox="0 0 96 96"><rect x="18" y="22" width="60" height="62" rx="9" fill="#e7eef8" stroke="#13509f" stroke-width="4"/><path d="M38 22v-8h20v8" fill="none" stroke="#13509f" stroke-width="4"/><path d="M34 22v62M62 22v62" stroke="#13509f" stroke-width="3"/><circle cx="30" cy="88" r="4" fill="#13509f"/><circle cx="66" cy="88" r="4" fill="#13509f"/><rect x="40" y="44" width="34" height="18" rx="4" fill="#13509f"/><text x="57" y="57.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Arial,sans-serif">23 kg</text></svg>',
    cabine:'<svg viewBox="0 0 96 96"><rect x="28" y="30" width="40" height="50" rx="8" fill="#e7eef8" stroke="#0c3a78" stroke-width="4"/><path d="M40 30V12h16v18" fill="none" stroke="#0c3a78" stroke-width="4"/><path d="M40 12h16" stroke="#0c3a78" stroke-width="6" stroke-linecap="round"/><circle cx="36" cy="85" r="4" fill="#0c3a78"/><circle cx="60" cy="85" r="4" fill="#0c3a78"/><path d="M38 44h20M38 54h20" stroke="#0c3a78" stroke-width="3"/></svg>',
    sac:'<svg viewBox="0 0 96 96"><path d="M24 40a24 24 0 0 1 48 0v38a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8z" fill="#e7eef8" stroke="#0c3a78" stroke-width="4"/><path d="M38 22c0-8 4-12 10-12s10 4 10 12" fill="none" stroke="#0c3a78" stroke-width="4"/><rect x="34" y="52" width="28" height="20" rx="5" fill="none" stroke="#0c3a78" stroke-width="4"/><path d="M34 60h28" stroke="#0c3a78" stroke-width="3"/></svg>'
  };
  function pick(t){t=(t||'').toLowerCase();if(t.indexOf('ski')>=0&&t.indexOf('bott')<0)return ICONS.ski;if(t.indexOf('bott')>=0)return ICONS.bottes;if(t.indexOf('kg')>=0||t.indexOf('valise')>=0||t.indexOf('bagage de')>=0)return ICONS.valise;if(t.indexOf('main')>=0||t.indexOf('cabine')>=0)return ICONS.cabine;return ICONS.sac;}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function render(v){
    var b=v.bagages||v;
    document.getElementById('soute').innerHTML=(b.soute||[]).map(function(x){return'<div class="item">'+pick(x.t)+'<div><b>'+esc(x.t)+'</b>'+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div></div>';}).join('');
    document.getElementById('cabine').innerHTML=(b.cabine||[]).map(function(x){return'<div class="item">'+pick(x.t)+'<div><b>'+esc(x.t)+'</b>'+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div></div>';}).join('');
    var ns=document.getElementById('noteSoute');ns.textContent=b.noteSoute||'';ns.hidden=!b.noteSoute;
    if(b.important){var im=b.important.replace(/^Très important\s*:\s*/i,'');document.getElementById('important').textContent=im.charAt(0).toUpperCase()+im.slice(1);}
    document.getElementById('tips').innerHTML=(b.conseils||[]).map(function(c){return'<li>'+esc(c)+'</li>';}).join('');
    if(v.titre)document.getElementById('t-titre').textContent=v.titre;
    if(v.sousDates)document.getElementById('t-dates').textContent=v.sousDates;
  }
  render(JSON.parse(document.getElementById('defaut').textContent));
  if(location.protocol!=='file:'){
    document.getElementById('f-url').textContent=new URL('./',location.href).href.replace(/^https?:\/\//,'').replace(/\/$/,'');
    fetch('voyage.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){if(v&&v.bagages)render(v);}).catch(function(){});
  }
})();
</script>
</body>
</html>
